[package]
name = "deckcraft-metafile"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/deckcraft"
description = "DeckCraft metafiles (ported from WordCraft): parses Windows WMF and EMF records into a neutral vector model (paths and bitmaps)"

[package.metadata.office-term]
upstream-revision = "354087ecd56305842582e9e410cf24d595849789"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
