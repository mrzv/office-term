[package]
name = "wordcraft-doc"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/wordcraft"
description = "WordCraft document model: stories, paragraphs, runs, tables, sections, styles, numbering, fields, notes, comments, revisions; edit primitives"

[package.metadata.office-term]
upstream-revision = "ff3c7d8d25bd8271326f372cb90f2c8106ec4d92"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
wordcraft-geom = { git = "https://github.com/storytold/wordcraft", version = "0.9.0" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
unicode-segmentation = "1"

[dev-dependencies]
proptest = "1"
